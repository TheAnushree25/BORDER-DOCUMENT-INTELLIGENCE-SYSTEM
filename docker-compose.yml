version: '3.8'

services:
  border-doc-intel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: border_doc_intel_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/border_intel.db:/app/backend/border_intel.db
