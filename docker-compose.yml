services:
  border-doc-intel:
    build: .
    container_name: border_doc_intel_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      # Set these in a .env file next to this compose file (see DEPLOYMENT_GUIDE.md)
      SECRET_KEY: ${SECRET_KEY:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - border_data:/app/data

volumes:
  border_data:
